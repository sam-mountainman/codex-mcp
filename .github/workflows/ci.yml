name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install host CLIs used by local diagnostics
        run: npm install --global @openai/codex @anthropic-ai/claude-code
      - run: npm run verify
      - run: claude plugin validate --strict .
      - name: Verify distributable files
        shell: bash
        run: |
          test -f .claude-plugin/plugin.json
          test -f .claude-plugin/marketplace.json
          test -f .mcp.json
          test -f dist/server.bundled.mjs
          test -f skills/codex-consult/SKILL.md
          test -f install.sh
          test -f install.ps1
      - name: Parse installer wrappers
        shell: bash
        run: |
          sh -n install.sh
          node --check scripts/setup.mjs
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw install.ps1))'
          fi
